plugins { id 'java'; id 'org.springframework.boot' version '3.5.4'; id 'io.spring.dependency-management' version '1.1.7' }
group = 'com.example.commerce'; version = '0.1.0'; java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }
dependencies {
 implementation 'org.springframework.boot:spring-boot-starter-validation'
 implementation 'org.springframework.boot:spring-boot-starter-web'; implementation 'org.springframework.boot:spring-boot-starter-actuator'; implementation 'org.springframework.boot:spring-boot-starter-jdbc'; implementation 'org.springframework.boot:spring-boot-starter-amqp'; implementation 'org.springframework.boot:spring-boot-starter-batch'; implementation 'org.springframework.boot:spring-boot-starter-data-redis'; implementation 'org.redisson:redisson-spring-boot-starter:3.50.0'; implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.3.0'; implementation 'org.flywaydb:flyway-core'; implementation 'org.flywaydb:flyway-mysql'; implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'; runtimeOnly 'com.mysql:mysql-connector-j'; testImplementation 'org.springframework.boot:spring-boot-starter-test'; testImplementation 'org.testcontainers:junit-jupiter'; testImplementation 'org.testcontainers:mysql'; testImplementation 'org.mockito:mockito-core'
}
tasks.named('test') { useJUnitPlatform() }
