services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_OPERATIONS_USER: ${MYSQL_OPERATIONS_USER}
      MYSQL_OPERATIONS_PASSWORD: ${MYSQL_OPERATIONS_PASSWORD}
      MYSQL_ORDER_USER: ${MYSQL_ORDER_USER}
      MYSQL_ORDER_PASSWORD: ${MYSQL_ORDER_PASSWORD}
    ports: ["${MYSQL_PORT:-3306}:3306"]
    volumes: ["mysql-data:/var/lib/mysql", "./mysql/init:/docker-entrypoint-initdb.d:ro"]
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "3306", "-p${MYSQL_ROOT_PASSWORD}"], interval: 5s, timeout: 5s, retries: 20 }
  redis:
    image: redis:7.4-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment: { RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}", RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}" }
    ports: ["${RABBITMQ_AMQP_PORT:-5672}:5672", "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"]
    healthcheck: { test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 10s, timeout: 5s, retries: 12 }
  operations-api:
    build: ../commerce-operations-dotnet
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Operations: Server=mysql;Port=3306;Database=commerce_operations;User=${MYSQL_OPERATIONS_USER};Password=${MYSQL_OPERATIONS_PASSWORD}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER:-commerce-operations-api}
      Jwt__Audience: ${JWT_AUDIENCE:-commerce-operations-ui}
      InitialAdmin__Email: ${INITIAL_ADMIN_EMAIL}
      InitialAdmin__Password: ${INITIAL_ADMIN_PASSWORD}
      InitialAdmin__DisplayName: ${INITIAL_ADMIN_DISPLAY_NAME:-Local Administrator}
      OrderEngine__BaseUrl: http://order-engine:8080
      OrderEngine__InternalApiKey: ${INTERNAL_API_KEY}
    ports: ["${DOTNET_API_PORT:-5000}:8080"]
    depends_on: { mysql: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"], interval: 10s, timeout: 5s, retries: 12 }
  order-engine:
    build: ../commerce-order-engine-java
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/commerce_order_engine
      SPRING_DATASOURCE_USERNAME: ${MYSQL_ORDER_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ORDER_PASSWORD}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    ports: ["${JAVA_API_PORT:-8080}:8080"]
    depends_on: { mysql: { condition: service_healthy }, redis: { condition: service_healthy }, rabbitmq: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"], interval: 10s, timeout: 5s, retries: 12 }
  operations-ui:
    build: ../commerce-operations-react
    ports: ["${REACT_PORT:-3000}:80"]
    depends_on: { operations-api: { condition: service_healthy }, order-engine: { condition: service_healthy } }
    healthcheck: { test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"], interval: 10s, timeout: 5s, retries: 12 }
volumes: { mysql-data: {} }
