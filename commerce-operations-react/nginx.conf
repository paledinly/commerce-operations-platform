server { listen 80; root /usr/share/nginx/html; index index.html; location / { try_files $uri /index.html; } location /health { access_log off; return 200 'ok'; add_header Content-Type text/plain; } location /api/ { proxy_pass http://operations-api:8080/api/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; } }
